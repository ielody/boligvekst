<!DOCTYPE html>
<html lang="no">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Boligpriser i Oslo</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <main class="page">
          <header class="page-header">
               <p class="eyebrow">Oslo · boligmarkedet</p>
               <h1>Hvordan har boligprisene utviklet seg?</h1>
               <p class="intro">Kartet viser kvadratmeterpris i 2025. Klikk på en bydel for prisene i 2018 og 2025 og prosentvis stigning i perioden.</p>
          </header>

          <section class="map-card" aria-label="Kart over boligpriser i Oslo">
               <div class="map-controls">
                    <p id="map-status" role="status">Laster kartdata …</p>
               </div>
               <div id="map" aria-label="Interaktivt kart over Oslos bydeler"></div>
               <div class="map-footer">
                    <div id="legend" class="legend" aria-label="Kartforklaring"></div>
                    <p class="source">Kilde: Oslo kommune, Boligmappa AS · BOL018</p>
               </div>
          </section>
     </main>

     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
     <script src="script.js"></script>
</body>
</html>
